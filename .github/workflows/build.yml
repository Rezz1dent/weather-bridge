name: Build

on:
  push:
    branches: [main]
    paths:
      - app/**
      - widget/**
      - '*.gradle.kts'
      - gradle/**
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Signing key (if the repository has one)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret: the APK is signed with a throwaway debug key."
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: weatherbridge
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon

      - name: Check the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" > badging.txt
          if grep -q 'launchable-activity:' badging.txt; then
            echo "FAIL: the app must not have a launcher icon"; exit 1
          fi
          grep -q "package: name='com.rezz1dent.weatherbridge'" badging.txt
          grep -q "application-label:'Weather Bridge'" badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep -q 'org.breezyweather.ACTION_UPDATE_NOTIFIER' manifest.txt
          grep -q 'org.breezyweather.READ_PROVIDER' manifest.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          if [ -n "$SIGNING_KEYSTORE" ] && grep -q 'CN=Android Debug' certs.txt; then
            echo "FAIL: signing key secret is set, but the APK has the debug key"; exit 1
          fi
          VERSION=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt)
          mkdir -p dist
          cp "$APK" "dist/weather-bridge-$VERSION.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: weather-bridge-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Release (new version on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"; exit 0
          fi
          NOTES="docs/release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" dist/*.apk widget/*.kwgt widget/*.zip \
            --target "$GITHUB_SHA" --title "Weather Bridge ${TAG#v}" --notes-file "$NOTES"

      - name: Widget release (new widget version on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KWGT=$(ls widget/*.kwgt | head -n1)
          N=$(basename "$KWGT" | sed -n 's/.*_v\([0-9]\+\)_.*/\1/p')
          TAG="widget-${N:0:1}.${N:1}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"; exit 0
          fi
          NOTES="docs/release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" widget/*.kwgt widget/*.zip \
            --target "$GITHUB_SHA" --title "Breezy Minimal ${TAG#widget-}" --notes-file "$NOTES"
