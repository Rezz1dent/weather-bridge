name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - app/**
      - widget/**
      - '*.gradle.kts'
      - gradle/**
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Signing key (if the repository has one)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret: the APK is signed with a throwaway debug key."
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon

      - name: Check the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          "$AAPT" dump badging "$APK" > badging.txt
          if grep -q 'launchable-activity:' badging.txt; then
            echo "FAIL: the app must not have a launcher icon"; exit 1
          fi
          grep -q "package: name='com.rezz1dent.weatherbridge'" badging.txt
          grep -q "application-label:'Weather Bridge'" badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep -q 'org.breezyweather.ACTION_UPDATE_NOTIFIER' manifest.txt
          grep -q 'org.breezyweather.READ_PROVIDER' manifest.txt
          VERSION=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt)
          mkdir -p dist
          cp "$APK" "dist/weather-bridge-$VERSION.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: weather-bridge-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk widget/*.kwgt widget/*.zip \
            --title "$GITHUB_REF_NAME" --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
